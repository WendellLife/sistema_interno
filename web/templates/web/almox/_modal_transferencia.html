<div class="overlay" x-show="modal === 'transf'" x-cloak @click.self="modal = null" style="display:none">
  <form class="modal" role="dialog" aria-labelledby="tr-titulo" hx-post="{% url 'web:almox_transferir' %}{% if setores %}?setor={{ setor.id }}{% endif %}" hx-target="#modal-erro"
        x-data="{ item: {id:'', codigo:'', desc:'', un:'', saldo:0}, q: '', escolher(id, codigo, desc, un, saldo) { this.item = {id, codigo, desc, un, saldo}; this.q=''; document.getElementById('tr-res').innerHTML=''; $nextTick(() => htmx.trigger('#tr-qtd', 'change')); } }">
    {% csrf_token %}
    <div class="modal__head"><h2 id="tr-titulo">Transferência entre setores</h2><button type="button" class="btn btn--fantasma btn--sm modal__fechar" @click="modal = null" aria-label="Fechar">{% include "web/partials/_icone.html" with nome="fechar" %}</button></div>
    <div class="campo"><label>Item</label><input placeholder="Código ou descrição" x-model="q" name="q" hx-get="{% url 'web:almox_itens_busca' %}{% if setores %}?setor={{ setor.id }}{% endif %}" hx-trigger="keyup changed delay:200ms" hx-target="#tr-res" hx-indicator="#tr-res-carregando" autocomplete="off"><div id="tr-res-carregando" class="htmx-indicator skeleton skeleton--lista" aria-hidden="true"><div class="skeleton__linha"></div><div class="skeleton__linha skeleton__linha--curta"></div></div><div id="tr-res" class="item-res"></div>
      <div class="linha-item ativa" x-show="item.id"><input type="hidden" name="item" :value="item.id"><span class="codigo" x-text="item.codigo"></span><span x-text="item.desc"></span><span class="mono muted">saldo <b x-text="item.saldo"></b> <span x-text="item.un"></span></span></div></div>
    <div class="form-grid" style="margin-top:12px">
      <div class="campo"><label>Quantidade</label><input id="tr-qtd" type="number" step="0.001" min="0.001" name="quantidade" required hx-get="{% url 'web:almox_previa_transferencia' %}{% if setores %}?setor={{ setor.id }}{% endif %}" hx-trigger="change, keyup changed delay:300ms" hx-include="closest form" hx-target="#tr-avisos" hx-indicator="#tr-avisos"></div>
      <div class="campo"><label>Setor destino</label><select name="setor_destino" required>{% for s in outros_setores %}<option value="{{ s.id }}">{{ s.nome }}</option>{% endfor %}</select></div>
      <div class="campo campo--full"><label>Motivo</label><input name="motivo" required maxlength="180" placeholder="Ex.: equipe de manutenção na linha 2"></div>
    </div>
    <div id="tr-avisos" class="recarregavel" style="margin-top:10px"></div>
    <div class="modal__rodape"><span class="nota">Ficar abaixo do mínimo não bloqueia; Compras é avisada.</span><button type="button" class="btn btn--secundario" @click="modal = null">Cancelar</button><button class="btn btn--primario">Transferir</button></div>
  </form>
</div>
