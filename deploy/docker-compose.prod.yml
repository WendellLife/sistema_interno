# docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sistema_interno}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 10s, retries: 5 }
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: ["redisdata:/data"]
  web:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    env_file: ../.env
    environment: { DJANGO_SETTINGS_MODULE: config.settings.prod }
    command: sh -c "uv run python manage.py migrate --noinput && uv run python manage.py collectstatic --noinput && uv run gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker -w ${WEB_WORKERS:-4} -b 0.0.0.0:8000 --access-logfile - --timeout 60"
    volumes: ["media:/app/media", "static:/app/staticfiles"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:8000/health/"], interval: 30s, retries: 3 }
  worker:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    env_file: ../.env
    environment: { DJANGO_SETTINGS_MODULE: config.settings.prod }
    command: uv run celery -A config worker -l info --concurrency=${WORKER_CONCURRENCY:-2}
    volumes: ["media:/app/media"]
    depends_on: [db, redis]
  beat:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    env_file: ../.env
    environment: { DJANGO_SETTINGS_MODULE: config.settings.prod }
    command: uv run celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on: [db, redis]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/media:ro
      - static:/srv/static:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [web]
  backup:
    image: postgres:16
    restart: unless-stopped
    env_file: ../.env
    environment: { PGPASSWORD: "${POSTGRES_PASSWORD}" }
    entrypoint: ["/bin/sh", "/backup.sh"]
    volumes: ["./backup.sh:/backup.sh:ro", "backups:/backups"]
    depends_on: [db]
volumes:
  pgdata: {}
  redisdata: {}
  media: {}
  static: {}
  backups: {}
