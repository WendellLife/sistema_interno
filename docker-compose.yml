services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sistema_interno
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sistema_interno"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "uv run python manage.py collectstatic --noinput &&
             uv run python manage.py migrate --noinput &&
             uv run python manage.py seed_demo &&
             uv run python manage.py runserver 0.0.0.0:8000"
    ports:
      - "18473:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: desenvolvimento-local-troque-antes-de-publicar-123456789
      DEBUG: "False"
      DATABASE_URL: postgres://postgres:postgres@db:5432/sistema_interno
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:18473,http://127.0.0.1:18473
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
